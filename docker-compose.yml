services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewpassword}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewuser} -d ${POSTGRES_DB:-brewlite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://brewuser:brewpassword@db:5432/brewlite?schema=public}
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_change_me}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && node prisma/seed.mjs && npm run start:dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/products >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_URL: http://backend:8000
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

volumes:
  db_data: